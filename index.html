<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Eleito - Kit Teológico</title>
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "a4a9fdf3-63ac-43c8-8345-7ce9a718e5aa",
        });
      });
    </script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 350px; }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 10px; }
        p { color: #636e72; font-size: 15px; line-height: 1.5; }
        .btn-push { background: #E67E22; color: white; border: none; padding: 15px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-push:hover { background: #d35400; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card">
        <h1>📚 Kit de Livros Grátis</h1>
        <p>Clique no botão abaixo e <b>permita as notificações</b> para receber seu link de download agora.</p>
        
        <button class="btn-push" id="btn-push">🔔 RECEBER MEU LIVRO</button>
        
        <p style="font-size: 11px; color: #b2bec3; margin-top: 20px;">Você poderá cancelar a qualquer momento.</p>
    </div>

    <script>
        // Força a abertura do pedido de inscrição ao clicar
        document.getElementById('btn-push').addEventListener('click', function() {
            OneSignalDeferred.push(function(OneSignal) {
                OneSignal.Slidedown.promptPush();
            });
        });
    </script>

</body>
</html>
