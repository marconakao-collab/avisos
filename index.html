<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>O Eleito - Ativar Notificações</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "a4a9fdf3-63ac-43c8-8345-7ce9a718e5aa",
        });

        // Quando o usuário permitir a notificação com sucesso:
        OneSignal.Notifications.addEventListener("permissionChange", function(permission) {
          if (permission === 'granted') {
            // Marca no navegador que ele já é inscrito para o sino sumir no blog principal
            localStorage.setItem('onesignal-inscrito', 'true');
            
            // Opcional: Redirecionar para o Kit após 3 segundos
            setTimeout(function(){
                window.location.href = "https://www.oeleito.com.br/p/livros.html";
            }, 3000);
          }
        });
      });
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:50px; font-family: sans-serif;">
        <h1>Ativando seu acesso ao Kit...</h1>
        <p>Por favor, clique em <b>"Permitir"</b> na janela que aparece no seu navegador.</p>
        <p><i>Após permitir, você será levado ao material automaticamente.</i></p>
    </div>
</body>
</html>
