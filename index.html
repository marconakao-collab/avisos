<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O Eleito - Kit Teológico</title>

  <!-- Manifest para PWA -->
  <link rel="manifest" href="/manifest.json" />

  <!-- OneSignal SDK (v16) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "a4a9fdf3-63ac-43c8-8345-7ce9a718e5aa",
      // Remova as linhas serviceWorkerPath e serviceWorkerParam
      // O SDK v16 detecta automaticamente na raiz do subdomínio
    });
  });
</script>

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5e8d3; /* Fundo creme alinhado à sua identidade */
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); /* Sombra dourada suave */
    }
    h2 {
      color: #333;
      margin-top: 0;
    }
    button {
      background: #d4af37; /* Dourado #d4af37 */
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Open Sans', sans-serif;
      font-size: 16px;
      transition: background 0.3s;
    }
    button:hover {
      background: #c19e2f;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>📚 Kit Teológico Grátis</h2>
    <p>Ative as notificações para receber seu link exclusivo.</p>
    <button id="btn-push">🔔 RECEBER AGORA</button>
  </div>

  <script>
    document.getElementById('btn-push').addEventListener('click', function () {
      OneSignalDeferred.push(function (OneSignal) {
        OneSignal.Slidedown.promptPush();
      });
    });
  </script>
</body>
</html>
